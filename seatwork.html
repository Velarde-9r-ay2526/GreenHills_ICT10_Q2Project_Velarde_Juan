<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Southeast Asia Nickname Finder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navyDark: '#0F172A',
                        navyCard: '#1E293B',
                        tealAccent: '#0D9488',
                        amberAccent: '#F59E0B',
                        softGray: '#F8FAFC'
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">

    <!-- PyScript Core CSS & JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body class="bg-softGray text-slate-800 font-body min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="bg-navyDark text-white py-14 px-6 text-center shadow-lg border-b-4 border-tealAccent">
        <div class="max-w-3xl mx-auto">
            <span class="inline-block px-3 py-1 bg-tealAccent/20 text-teal-300 text-xs font-semibold uppercase tracking-wider rounded-full mb-3 border border-tealAccent/30">
                11 Nations • Regional Guide
            </span>
            <h1 class="text-3xl sm:text-5xl font-display font-extrabold tracking-tight mb-3 text-white">
                Southeast Asia Nickname Atlas
            </h1>
            <p class="text-sm sm:text-base text-slate-300 max-w-lg mx-auto font-normal leading-relaxed">
                Discover the historical, geographical, and cultural titles given to countries across Southeast Asia.
            </p>
        </div>
    </header>

    <!-- Main Content / Lookup Card -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border border-slate-200 rounded-2xl shadow-xl p-8 max-w-lg w-full">
            <div class="space-y-6">
                <div>
                    <span class="text-xs uppercase tracking-widest text-tealAccent font-bold block mb-1">Country Explorer</span>
                    <h2 class="text-2xl font-display font-bold text-navyDark">Search for a Country</h2>
                </div>

                <!-- Input Box & Datalist -->
                <div class="space-y-2">
                    <label for="country_input" class="text-xs text-slate-500 font-medium">Select or type country name:</label>
                    <input type="text" id="country_input" list="sea_countries" placeholder="e.g., Philippines, Thailand, Vietnam" 
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-tealAccent text-slate-800 text-sm shadow-sm transition">
                    
                    <datalist id="sea_countries">
                        <option value="Brunei">
                        <option value="Cambodia">
                        <option value="East Timor">
                        <option value="Indonesia">
                        <option value="Laos">
                        <option value="Malaysia">
                        <option value="Myanmar">
                        <option value="Philippines">
                        <option value="Singapore">
                        <option value="Thailand">
                        <option value="VietNam">
                    </datalist>
                </div>

                <!-- Search Button -->
                <button id="search_btn" py-click="get_country_nickname" 
                        class="w-full py-3.5 bg-tealAccent hover:bg-teal-700 text-white font-display font-semibold text-sm tracking-wide rounded-xl transition shadow-md hover:shadow-lg active:scale-[0.99]">
                    Get Nickname
                </button>

                <!-- Output Display Container -->
                <div id="output_box" class="pt-4 mt-2 border-t border-slate-100 min-h-[60px] flex items-center justify-center text-center">
                    <p class="text-slate-400 text-sm italic">Enter a country name above to reveal its title.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-navyDark text-slate-400 py-4 text-center text-xs">
        <p>Seatwork 1 • 2nd Quarter ICT Project</p>
    </footer>

    <!-- Load external Python file -->
    <script type="py" src="main.py"></script>
</body>
</html>
